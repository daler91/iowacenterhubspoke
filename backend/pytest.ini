[pytest]
markers =
    asyncio: mark a test as asynchronous and run it with pytest-asyncio.
    auth_contract: required auth API compatibility contract tests.
    integration: exercises real HTTP endpoints against a live MongoDB.
addopts = --strict-markers
# Integration tests share one event loop for the whole session: Motor binds
# its client to the loop on first use, and the app's ``database.db`` handle is
# module-level, so a per-test loop would break every test after the first.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
