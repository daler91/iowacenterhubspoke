name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on a PR. Without this, pushing three times in a row
# leaves three full matrices burning runners, and the two stale ones report
# results for code nobody is looking at any more. Never cancel on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default: every job in this workflow only reads repo
# contents (install deps, build, test, lint, upload a report artifact).
# Individual jobs can widen permissions if needed — none do today.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # The integration suite (tests/test_endpoints_integration.py) drives real
    # HTTP endpoints against this. Without it those tests skip, and the only
    # coverage left is unit tests against monkeypatched module globals — which
    # are structurally blind to wiring errors *between* units. Three of the
    # four bugs found in the July 2026 review were exactly that shape.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # Redis too, not just Mongo. /api/v1/health 503s whenever Redis is
      # unavailable — CSRF validation and rate limiting depend on it — so
      # without this the health endpoint could not be asserted healthy. It
      # also stops arq burning five connection retries per enqueue attempt.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: hubspoke_ci
      REDIS_URL: redis://localhost:6379
      # Turns the integration suite's "no Mongo, skip" into a hard failure,
      # so a broken service container cannot make the suite silently vacuous.
      REQUIRE_MONGO: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m flake8 --max-line-length=120 --exclude=__pycache__,tests .
      - run: python -m pytest --collect-only -q -W error::pytest.PytestWarning tests/
      - run: python -m pytest -m auth_contract tests/test_auth_contract.py -v
      - name: Integration tests (real MongoDB)
        run: python -m pytest -m integration tests/ -v
      # Deselect the integration tests here — the step above already ran them.
      # Running them twice in one job shares Redis-backed rate-limit counters
      # across both passes, so /auth/register's 5/minute cap tripped on the
      # second run and returned 429 where the test expected 400.
      - run: python -m pytest tests/ -m "not integration" -v

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      # Pinned to full SHAs (checkout v4.2.2, setup-python v5.3.0) so a tag
      # re-point on the upstream action can't silently inject code into our
      # security gates. Bump the comment + SHA together.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependency scanners
        run: pip install pip-audit mypy
      - name: Dependency vulnerability scan
        run: |
          # PYSEC-2025-183 / CVE-2025-45768 has no fixed PyJWT release and
          # is disputed upstream because HMAC key strength is chosen by the
          # application. backend/core/auth.py enforces >=32-byte JWT_SECRET
          # before PyJWT can sign or verify HS256 tokens.
          # requirements-dev.txt includes requirements.txt, so this covers both —
          # previously only the production file was scanned while CI installed dev.
          pip-audit -r requirements-dev.txt --strict --ignore-vuln PYSEC-2025-183
      - name: Static type check
        run: mypy . --ignore-missing-imports --follow-imports=silent --no-strict-optional
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript typecheck (advisory — full error list for the log)
        run: npm run typecheck
        continue-on-error: true
      # Blocking. The advisory step above cannot fail the build because of a
      # ~1,000-error strict-mode baseline (implicit-any props, untyped Radix
      # wrappers), which meant a *new* type error was indistinguishable from
      # the existing noise — that is how a call to a nonexistent API method
      # shipped in src/features/coordination/api.ts. The ratchet fails only on
      # an increase, so new errors are caught while the baseline is paid down.
      - name: TypeScript error ratchet (blocking)
        run: npm run check-types-ratchet
      - run: npm run build
      - run: npm test
      - run: npm run check-testids
      - run: npm run lint
      # TODO(blocking): this repo's history is dominated by dependency-bump
      # PRs, so the gate that catches vulnerable deps should be able to fail
      # the build. It cannot be flipped yet — `npm audit` currently reports 2
      # high findings for GHSA-qwww-vcr4-c8h2 (react-router 7.12.0–8.2.0, RSC
      # Mode CSRF bypass). This SPA does not use RSC mode, so the advisory
      # does not apply in practice, but npm audit cannot express that. Resolve
      # by moving react-router-dom past 8.2.0, then drop continue-on-error.
      - name: Frontend dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Railway deploys this Dockerfile (railway.json). Nothing in CI built it
    # until now, so a change that broke the image — a bad COPY path, a missing
    # system package, a frontend build failure inside the builder stage —
    # merged green and only failed at deploy time. This builds the real
    # production image and boots it far enough to answer /api/v1/health.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the production image
        run: docker build -t hubspoke:ci .
      # A build that succeeds but produces an image that cannot start is still
      # a broken deploy, so boot it. Host networking lets the container reach
      # the service containers on localhost without a shared compose network.
      - name: Boot the image and wait for /api/v1/health
        run: |
          docker run -d --name hubspoke-ci --network host \
            -e MONGO_URL=mongodb://localhost:27017 \
            -e DB_NAME=hubspoke_docker_ci \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=ci-only-secret-at-least-32-bytes-long \
            -e ENVIRONMENT=development \
            -e PORT=8080 \
            hubspoke:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health > /tmp/health.json; then
              echo "health responded:"; cat /tmp/health.json; exit 0
            fi
            sleep 2
          done
          echo "::error::image never answered /api/v1/health"
          docker logs hubspoke-ci
          exit 1
      # The entrypoint drops to uid 1001 and re-verifies the drop actually
      # happened (backend/docker-entrypoint.py). Assert it from outside too —
      # a silent failure here is how a container ends up serving as root.
      - name: Assert the container is not running as root
        run: |
          uid=$(docker exec hubspoke-ci id -u)
          echo "container uid: $uid"
          test "$uid" != "0"
      - name: Container logs
        if: always()
        run: docker logs hubspoke-ci || true
      - name: Stop
        if: always()
        run: docker rm -f hubspoke-ci || true
