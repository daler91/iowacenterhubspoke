name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: every job in this workflow only reads repo
# contents (install deps, build, test, lint, upload a report artifact).
# Individual jobs can widen permissions if needed — none do today.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m flake8 --max-line-length=120 --exclude=__pycache__,tests .
      - run: python -m pytest --collect-only -q -W error::pytest.PytestWarning tests/
      - run: python -m pytest -m auth_contract tests/test_auth_contract.py -v
      - run: python -m pytest tests/ -v

  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Pinned to full SHAs (checkout v4.2.2, setup-python v5.3.0) so a tag
      # re-point on the upstream action can't silently inject code into our
      # security gates. Bump the comment + SHA together.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependency scanners
        run: pip install pip-audit mypy
      - name: Dependency vulnerability scan
        run: |
          # PYSEC-2025-183 / CVE-2025-45768 has no fixed PyJWT release and
          # is disputed upstream because HMAC key strength is chosen by the
          # application. backend/core/auth.py enforces >=32-byte JWT_SECRET
          # before PyJWT can sign or verify HS256 tokens.
          pip-audit -r requirements.txt --strict --ignore-vuln PYSEC-2025-183
      - name: Static type check
        run: mypy . --ignore-missing-imports --follow-imports=silent --no-strict-optional
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript typecheck (advisory — full error list for the log)
        run: npm run typecheck
        continue-on-error: true
      # Blocking. The advisory step above cannot fail the build because of a
      # ~1,000-error strict-mode baseline (implicit-any props, untyped Radix
      # wrappers), which meant a *new* type error was indistinguishable from
      # the existing noise — that is how a call to a nonexistent API method
      # shipped in src/features/coordination/api.ts. The ratchet fails only on
      # an increase, so new errors are caught while the baseline is paid down.
      - name: TypeScript error ratchet (blocking)
        run: npm run check-types-ratchet
      - run: npm run build
      - run: npm test
      - run: npm run check-testids
      - run: npm run lint
      # TODO(blocking): this repo's history is dominated by dependency-bump
      # PRs, so the gate that catches vulnerable deps should be able to fail
      # the build. It cannot be flipped yet — `npm audit` currently reports 2
      # high findings for GHSA-qwww-vcr4-c8h2 (react-router 7.12.0–8.2.0, RSC
      # Mode CSRF bypass). This SPA does not use RSC mode, so the advisory
      # does not apply in practice, but npm audit cannot express that. Resolve
      # by moving react-router-dom past 8.2.0, then drop continue-on-error.
      - name: Frontend dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
